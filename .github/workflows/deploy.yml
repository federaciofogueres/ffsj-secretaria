name: Build and deploy Angular

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout secretaria
        uses: actions/checkout@v4
        with:
          path: ffsj-secretaria

      - name: Checkout shared library
        uses: actions/checkout@v4
        with:
          repository: federaciofogueres/ffsj-workspace-2
          path: ffsj-workspace-2
          token: ${{ secrets.FFSJ_WORKSPACE_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install shared library dependencies
        working-directory: ffsj-workspace-2
        run: npm ci

      - name: Build shared library
        working-directory: ffsj-workspace-2
        run: npm run build:lib

      - name: Install dependencies
        working-directory: ffsj-secretaria
        run: npm ci

      - name: Build Angular
        working-directory: ffsj-secretaria
        run: npm run build:prod -- --base-href /

      - name: Deploy to branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./ffsj-secretaria/dist/ffsj-secretaria/browser
          force_orphan: true
