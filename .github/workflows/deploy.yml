name: Build and deploy Angular

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_environment:
        description: Entorno de GitHub que contiene las URLs de las APIs
        required: true
        default: frontend-production
        type: choice
        options: [frontend-eastus, frontend-france, frontend-production]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.api_environment || 'frontend-production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build:prod -- --base-href /

      - name: Configure runtime API URLs
        env:
          FFSJ_CENSO_API_BASE_PATH: ${{ vars.FFSJ_CENSO_API_BASE_PATH }}
          FFSJ_SECRETARIA_API_BASE_PATH: ${{ vars.FFSJ_SECRETARIA_API_BASE_PATH }}
          FFSJ_FILES_BASE_PATH: ${{ vars.FFSJ_FILES_BASE_PATH }}
        run: node scripts/write-runtime-config.js ./dist/ffsj-secretaria/browser/assets/runtime-config.json

      - name: Add SPA fallback
        run: |
          cp ./dist/ffsj-secretaria/browser/index.html ./dist/ffsj-secretaria/browser/404.html
          printf '%s\n' \
            '<IfModule mod_rewrite.c>' \
            'RewriteEngine On' \
            'RewriteBase /' \
            'RewriteRule ^index\.html$ - [L]' \
            'RewriteCond %{REQUEST_FILENAME} !-f' \
            'RewriteCond %{REQUEST_FILENAME} !-d' \
            'RewriteRule . /index.html [L]' \
            '</IfModule>' \
            > ./dist/ffsj-secretaria/browser/.htaccess

      - name: Deploy to branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist/ffsj-secretaria/browser
          force_orphan: true
