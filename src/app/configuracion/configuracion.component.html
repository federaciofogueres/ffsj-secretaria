<section class="ux-card configuracion">
  <div class="p-4 p-md-5">
    <p class="ux-overline mb-1">Administración</p>
    <h1 class="ux-page-title">Configuración</h1>
    <p class="text-muted">Centraliza las opciones administrativas de Secretaría.</p>
    <nav class="d-flex gap-2 mb-4">
      <button class="btn" [class.btn-foc-rojo]="tab === 'ejercicios'" [class.btn-outline-secondary]="tab !== 'ejercicios'" (click)="tab = 'ejercicios'">Ejercicios</button>
      <button class="btn" [class.btn-foc-rojo]="tab === 'registro'" [class.btn-outline-secondary]="tab !== 'registro'" (click)="tab = 'registro'">Registro</button>
      <button class="btn" [class.btn-foc-rojo]="tab === 'rubi'" [class.btn-outline-secondary]="tab !== 'rubi'" (click)="tab = 'rubi'">Rubi</button>
    </nav>
    <app-ejercicios *ngIf="tab === 'ejercicios'"></app-ejercicios>
    <app-rubi-admin *ngIf="tab === 'rubi'"></app-rubi-admin>
    <section *ngIf="tab === 'registro'">
      <h2 class="h5">Destinatarios administrativos</h2>
      <p class="text-muted">Asigna cada departamento a un miembro de Federación habilitado para Registro.</p>
      <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
      <div class="row g-2 align-items-end">
        <div class="col-md-4"><label class="form-label">Departamento</label><input class="form-control" [(ngModel)]="departamento" /></div>
        <div class="col-md-4"><label class="form-label">Responsable</label><select class="form-select" [(ngModel)]="responsableId"><option [ngValue]="null">Selecciona una persona</option><option *ngFor="let responsable of responsables" [ngValue]="responsable.id">{{ responsable.nombreCompleto }}</option></select></div>
        <div class="col-md-3"><label class="form-label">Correo</label><input class="form-control" type="email" [(ngModel)]="email" /></div>
        <div class="col-md-1 d-grid"><button class="btn btn-foc-rojo" [disabled]="loading" (click)="guardarDestinatario()">Guardar</button></div>
      </div>
      <div class="mt-4" *ngIf="destinatarios.length">
        <article class="border rounded p-3 mb-2" *ngFor="let item of destinatarios">
          <strong>{{ item.departamentoNombre }}</strong>
          <div class="row g-2 mt-1">
            <div class="col-md-4"><select class="form-select" [(ngModel)]="item.responsableId"><option [ngValue]="null">Selecciona una persona</option><option *ngFor="let responsable of responsables" [ngValue]="responsable.id">{{ responsable.nombreCompleto }}</option></select></div>
            <div class="col-md-4"><input class="form-control" type="email" [(ngModel)]="item.email" /></div>
            <div class="col-md-2 d-grid"><button class="btn btn-outline-secondary" [disabled]="loading" (click)="actualizarDestinatario(item)">Actualizar</button></div>
            <div class="col-md-2 d-grid"><button class="btn btn-outline-danger" [disabled]="loading" (click)="solicitarEliminarDestinatario(item)">Eliminar</button></div>
          </div>
        </article>
      </div>
    </section>
  </div>
</section>
<app-confirm-dialog
  *ngIf="destinatarioPendienteDeEliminar"
  title="Eliminar destinatario"
  [message]="'Se eliminará el destinatario de ' + destinatarioPendienteDeEliminar.departamentoNombre + '. Esta acción dejará de mostrarlo en Registro.'"
  confirmLabel="Eliminar"
  (cancel)="cancelarEliminarDestinatario()"
  (confirmed)="confirmarEliminarDestinatario()">
</app-confirm-dialog>
