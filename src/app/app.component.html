<div class="app-shell">
  <header class="app-header">
    <div class="app-header-inner">
      <a routerLink="/" class="brand" aria-label="Ir al inicio">
        <img class="logo" src="assets/img/logo-intranet.png" alt="FFSJ" />
        <span>
          <strong>FFSJ Secretaria</strong>
          <small>Gestion interna</small>
        </span>
      </a>

      <nav class="desktop-nav" aria-label="Navegacion principal">
        <a
          *ngFor="let link of navLinks"
          [class.d-none]="!canShowLink(link)"
          class="nav-link"
          routerLink="{{ link.path }}"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        >
          <i class="bi" [ngClass]="link.icon"></i>
          <span>{{ link.label }}</span>
        </a>
      </nav>

      <div class="header-actions">
        <div class="mode-pill" *ngIf="isLoggedIn">
          <span class="mode-dot"></span>
          <span>
            <strong>{{ modeLabel }}</strong>
            <small>{{ actorLabel }}</small>
          </span>
        </div>

        <label class="exercise-picker" *ngIf="isLoggedIn && ejercicios.length">
          <span class="visually-hidden">Ejercicio</span>
          <select [ngModel]="selectedEjercicioId" (ngModelChange)="onEjercicioChange($event)">
            <option *ngFor="let ejercicio of ejercicios" [ngValue]="ejercicio.id">
              Ejercicio {{ ejercicio.ejercicio }}
            </option>
          </select>
        </label>

        <a *ngIf="isLoggedIn" class="pending-pill d-none d-lg-inline-flex" routerLink="/solicitudes">
          <i class="bi bi-bell-fill"></i>
          <span>Tareas</span>
        </a>

        <button *ngIf="isLoggedIn" class="logout-button d-none d-md-inline-flex" type="button" (click)="logout()">
          Salir
        </button>

        <button
          class="menu-button d-md-none"
          type="button"
          (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen"
          aria-label="Abrir menu"
        >
          <i class="bi" [ngClass]="menuOpen ? 'bi-x-lg' : 'bi-list'"></i>
        </button>
      </div>
    </div>

    <div class="mobile-menu d-md-none" [class.show]="menuOpen">
      <a
        *ngFor="let link of navLinks"
        [class.d-none]="!canShowLink(link)"
        class="mobile-link"
        routerLink="{{ link.path }}"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
      >
        <span class="d-flex align-items-center gap-2">
          <i class="bi" [ngClass]="link.icon"></i>
          {{ link.label }}
        </span>
        <i class="bi bi-chevron-right"></i>
      </a>
      <button *ngIf="isLoggedIn" class="mobile-link border-0 w-100" type="button" (click)="logout()">
        <span>Salir</span>
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </header>

  <main class="app-content">
    <div class="content-container">
      <section *ngIf="ejercicioSinIniciar" class="alert alert-warning d-flex flex-wrap align-items-center justify-content-between gap-2" role="status">
        <span>El ejercicio seleccionado aun no esta iniciado para tu asociacion.</span>
        <button class="btn btn-danger btn-sm" type="button" [disabled]="iniciandoEjercicio" (click)="iniciarEjercicioAsociacion()">
          {{ iniciandoEjercicio ? 'Iniciando...' : 'Iniciar ejercicio' }}
        </button>
      </section>
      <div *ngIf="ejercicioError" class="alert alert-danger" role="alert">{{ ejercicioError }}</div>
      <router-outlet></router-outlet>
    </div>
  </main>

  <footer class="tab-bar d-md-none" *ngIf="isLoggedIn">
    <button
      *ngFor="let link of visibleMobileLinks"
      class="tab-button"
      type="button"
      [routerLink]="link.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: link.path === '/' }"
    >
      <i class="bi" [ngClass]="link.icon"></i>
      <span>{{ link.label }}</span>
    </button>
  </footer>

  <lib-ffsj-alert></lib-ffsj-alert>
</div>
