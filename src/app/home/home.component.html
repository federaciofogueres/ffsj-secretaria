<section class="hero">
  <div class="copy">
    <p class="eyebrow">Gestión integral</p>
    <h1>ffsj-secretaria</h1>
    <p class="lead">
      Selecciona uno de los módulos para comenzar a trabajar con la información de tu asociación.
    </p>
  </div>
  <div class="badge">Angular 20</div>
</section>

<section class="modules">
  <h2>Módulos disponibles</h2>
  <div class="grid">
    <a
      *ngFor="let module of modules"
      class="card"
      [routerLink]="module.path"
      [style.--accent]="module.accent"
      aria-label="Ir al módulo {{ module.title }}"
    >
      <div class="pill">{{ module.title }}</div>
      <p class="description">{{ module.description }}</p>
      <span class="cta">Entrar →</span>
    </a>
  </div>
</section>
